apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-app-gitops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # REPLACE with your GitHub repository URL:
    repoURL: https://github.com/fatimahaneef-tech/aws-eks-gitops-platform.git
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true