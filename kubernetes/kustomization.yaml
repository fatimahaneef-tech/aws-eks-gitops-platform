apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio-app

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - network-policy.yaml

# Argo CD or CI can override the image tag cleanly without modifying raw YAML files
images:
  - name: public.ecr.aws/docker/library/python
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/portfolio-fastapi-app
    newTag: v1.0.0